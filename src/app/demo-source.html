icle></div><article class="card" id="timeline"><div class="section-head"><h2>今天发生的事</h2><small>${s.events.length} 条事件 · 按最新添加排序</small></div><div class="timeline">${s.events.map(e=>{let d=eventData(e);return `<button class="event" data-act="detail" data-id="${e.id}"><time>${d.time}</time><span class="event-icon">${icon(d.icon)}</span><span><strong>${d.title}</strong><p>${d.zone} · ${e.type==='pet'?'连续观察已合并':'模拟事件'}</p></span><span class="event-status">${statusText(e)}　↗</span></button>`}).join('')}</div></article></section><aside class="stack"><article class="card camera"><div class="section-head"><h3>${icon('camera')} 家里的视角</h3><span class="pill ${blocked()?'gold':''}">${blocked()?'观察暂停':'画面示意'}</span></div>${blocked()?'<div class="camera-placeholder">现场状态待更新<br><small>最后样例画面 18:30</small></div>':`<div class="camera-scene"><img src="${room}" alt="客厅空间插画示意，包含沙发、窗户和宠物区域"><span class="source">客厅插画 · 场景示意</span><span class="scene-time">E30 / 18:30</span></div>`}<div class="camera-caption"><div class="row between"><strong class="small">客厅 · E30</strong>${btn('覆盖范围','coverage','ghost tiny')}</div><p>覆盖沙发与窗边；水碗区域可在设置中查看。</p></div></article><article class="card"><div class="section-head"><h3>管家正在照顾</h3>${icon('leaf')}</div><div class="device-row"><span>团子 · 宠物</span><span>${pet?'饮水已记录':'关注已开启'}</span></div><div class="device-row"><span>门口 · E340</span><span>${s.offline?'连接中断':'通道模拟'}</span></div><div class="device-row"><span>窗边 · E30</span><span>降雨组合提醒</span></div><div class="device-row"><span>本人 · 生活目标</span><span>温和活动提醒</span></div>${btn('管理关注与权限 →','toSettings','ghost tiny')}</article><article class="card"><h3>下一件重要的事</h3><div class="agenda"><time>${m?esc(m.due.slice(11)):'09:00'}</time><p>${m?'会议 · '+esc(m.due.slice(0,10)):'会议安排 · 待记入'}</p></div><p class="small muted">到点获取新观察，结合现场状态选择提醒方式。</p>${btn('查看记忆与安排 →','toMemory','ghost tiny')}<p class="source-note">家庭时区：Asia/Shanghai · 示例</p></article></aside></div>${lab()}`}

function rules(){return heading('你的管家，按你的习惯','每一次主动关怀，都遵循明确的边界。')+`<form id="rules-form" class="two-col"><section class="card"><h2>关怀与提醒</h2><label class="field"><span>宠物关注度 <output id="care-value">${s.rules.care}</output> / 10</span><input type="range" id="care" min="0" max="10" value="${s.rules.care}"></label><label class="field"><span>紧急联络建议阈值 <output id="threshold-value">${s.rules.threshold}</output> / 10</span><input type="range" id="threshold" min="6" max="10" value="${s.rules.threshold}"></label><div class="form-row"><label class="field"><span>未回应升级间隔</span><select id="timeout"><option value="60" ${s.rules.timeout===60?'selected':''}>60 秒</option><option value="30" ${s.rules.timeout===30?'selected':''}>30 秒</option></select></label><label class="field"><span>安静时段开始（至 07:00）</span><input type="time" id="quiet" value="${s.rules.quiet}" required></label></div><div class="form-row"><label class="field"><span>每日可选关怀次数</span><input id="budget" type="number" min="0" max="10" value="${s.rules.budget}" required></label><label class="field"><span>关怀语气</span><select id="tone">${['简洁','温暖','轻松'].map(v=>`<option ${v===s.rules.tone?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field"><span>门口感谢语</span><textarea id="thanks" rows="3" maxlength="100" required>${esc(s.rules.thanks)}</textarea></label><p class="source-note">对外话术仅表达待客信息。包含家庭成员姓名、作息或屋内占用信息时，请先修改。</p><button class="btn" type="submit" style="margin-top:18px">保存规则</button></section><aside class="stack"><article class="card"><h2>典型事件预览</h2><div class="preview" id="rule-preview" style="margin-top:20px">${rulePreview(s.rules)}</div><p class="source-note" style="margin-top:15px">预览反映待保存规则。真实电话与设备控制均须单次确认。</p></article><article class="card"><h3>待客规则</h3><p class="small muted" style="margin-top:13px">当门口出现放下物品行为，且访客仍在可见区间，以你设置的语气建议播放感谢。</p><div class="receipt">1. 检查事件证据与新鲜度<br>2. 检查通道与权限<br>3. 展示完整话术，请你确认<br>4. 保留执行回执，结束本次待客</div></article><article class="card"><h3>持续保留的提醒</h3><p class="smal ss="pill gold">通道模拟</span></div><div><strong>设备 / 模型 / 外呼</strong><span class="pill gold">待接入验证</span></div></div></article><article class="card"><h3>重新开始演示</h3><p class="small muted" style="margin:12px 0">清除当前原型的演示事件、安排、规则与显示名称，恢复初始样例。</p>${btn('重置演示状态','reset','secondary')}</article></aside></div>`}

function detail(id){current=id;let e=getEvent(id);if(!e)return;let d=eventData(e);show(d.title,`<div class="row between"><span class="pill ${d.kind==='urgent'?'red':'gold'}">模拟事件 · ${statusText(e)}</span><span class="small muted">${d.time} / ${d.zone}</span></div><div class="evidence">${d.facts.map(x=>`<div><time>模拟证据节点</time>${x}</div>`).join('')}</div><h3>观察到的事实</h3><p>${d.facts.map(x=>esc(x)).join('；')}。</p><h3>仍需确认</h3><p class="muted">${d.unknown}</p><h3>JEV 事件评价 <small class="muted">演示参数</small></h3>${score('紧急程度',d.u,10,true)}${score('个人关注度',e.type==='pet'?s.rules.care:d.c,10)}${score('模型估计',d.confidence,1)}<p class="source-note">模型估计反映示例证据支持程度；数值尚待实测校准。</p><h3>管家的建议</h3><p>${e.type==='pet'&&s.mode==='efficient'?'当前高效模式：静默记录饮水行为。':d.suggest}</p>${e.status==='snoozed'?'<div class="notice" style="margin-top:15px">已安排 5 分钟后提醒。使用下方按钮推进模拟时钟。</div>':''}${e.status==='calling'||e.status==='connected'||e.status==='contact'?`<div class="notice" style="margin-top:15px">${e.status==='contact'?'等待家人回应':'等待本人明确回应'} · ${e.remaining??s.rules.timeout} 秒<br>接通状态与确认处理分别记录。</div>`:''}<div class="receipt">${e.receipts.length?e.receipts.map(x=>esc(x)).join('<br>'):'行动记录：已形成建议，等待下一步。'}</div><div class="row">${eventActions(e)}</div><details style="margin-top:22px"><summary class="small muted">数据来源与保留期限</summary><p class="source-note">来源 simulated_event · 模拟文本证据 · 关键帧设计保留 24 小时；事件语义 30 天。此原型数据保存在当前浏览器。</p></details>`)}
function score(label,v,max,urgent=false){return `<div class="score-row ${urgent?'urgent':''}"><span>${label}</span><div class="score-bar"><i style="width:${v/max*100}%"></i></div><span>${v} / ${max}</span></div>`}
function eventActions(e){let a='',d=eventData(e),id=`data-id="${e.id}"`;if(['resolved','corrected','cancelled'].includes(e.status))return btn('关闭','close');if(d.kind==='urgent'){
if(e.status==='pending'&&d.u<s.rules.threshold)a+=btn('现场核实并知晓','ack','',id);if(e.status==='pending'&&d.u>=s.rules.threshold)a+=btn('确认联系本人','call','',id);
if(['calling','connected'].includes(e.status))a+=btn(`推进 ${e.remaining??s.rules.timeout} 秒`,'advance','secondary',id)+(e.status==='calling'?btn('模拟接通','connected','secondary',id):'')+btn('模拟通道失败','fail','ghost',id);
if(e.status==='escalate')a+=btn('确认联系紧急联系人','callContact','',id);
if(e.status==='contact')a+=btn('家人确认接手','ack','',id)+btn('模拟联系失败','fail','secondary',id);
if(e.status==='failed')a+=btn('转人工并确认知晓','ack','',id);
}
if(e.status==='pending'&&d.kind==='voice')a+=btn('确认感谢语','voice','',id);
if(e.status==='pending'&&d.kind==='wake'&&!e.voiceCount)a+=btn('确认温和提醒','wakeVoice','',id)+btn('选择当前现场状态','wakeState','secondary',id);
if(e.status==='snoozed')a+=btn('推进 5 分钟','resume','',id);
if(e.status==='ack')a+=btn('标记处理完成','resolve','',id);else a+=btn('我已知晓','ack','secondary',id);
if(['pending','recorded'].includes(e.status)){if(!e.followups)a+=btn('稍后提醒','snooze','secondary',id);a+=btn('更正为普通活动','correct','ghost',id);}
if(d.kind==='care')a+=btn('少提醒此类','lessCare','ghost',id);
return a}
function addScene(type){if(type==='wake'){wake();return}if(blocked()){toast('请恢复感知与设备连接，再生成新观察');return}let existing=s.events.find(e=>e.type===type&&!['resolved','corrected','cancelled'].includes(e.status));if(existing){navigate('home');detail(existing.id);return}let d=scenes[type],quiet=d.time>=s.rules.quiet||d.time<'07:00',budgetUsed=s.events.filter(e=>e.shared).length;let share=d.kind==='care'&&s.mode==='companion'&&!quiet&&budgetUsed<s.rules.budget;let e={id:'e'+s.seq++,type,status:['record','care'].includes(d.kind)?'recorded':'pending',receipts:[],shared:share};if(d.kind==='care')e.receipts.push(share?'已生成应用内关怀卡 · 通道模拟':'已静默记录 · 当前模式或频控策略');templates.filter(t=>s.installed.includes(t.id)&&t.event===type).forEach(t=>e.receipts.push('已启用模板 '+t.name+'：'+(t.action==='suggest_voice'?'建议感谢语，执行前确认':'生成关怀提议，遵循当前模式与频控')));s.events.unshift(e);s.clock='09/27 '+d.time;navigate('home');toast(share?'一条新的生活关怀，已放进时间线':'模拟事件已加入今天的记录')}

function parse(){let t=$('utterance').value.trim(),r=$('capture-result');if(!t){r.textContent='请输入口述内容。';return}if(/他说|她说|如果|可能|不确定|或许/.test(t)){r.innerHTML='<div class="preview">这句话的归属或条件仍需确认。当前保留为待核实说明。</div>';return}if(/取消|不开|别提醒|不要提醒/.test(t)){s.memories.forEach(m=>{if(m.status==='active')m.status='cancelled'});s.events.filter(e=>e.type==='wake').forEach(e=>{e.status='cancelled';e.receipts.push('安排已撤销，关联提醒已停止')});persist();r.innerHTML='<div class="preview">已撤销演示会议安排，同时停止关联提醒。</div>';return}let match=t.match(/明天.*?(\d{1,2})\s*[点:时]/);if(!match||+match[1]>23||!/会/.test(t)){r.innerHTML='<div class="preview">时间或事项需要进一步核实。请用“明天9点开会”一类明确的示例表达。</div>';return}if(/不|没/.test(t)&&!/记住/.test(t)){r.innerHTML='<div class="preview">语义可能包含否定，保留为待核实说明。</div>';return}let due='2026-09-28T'+match[1].padStart(2,'0')+':00',m=s.memories.find(m=>m.status==='active');if(!s.autoMemory){r.innerHTML=`<div class="preview">已形成候选：${due.replace('T',' ')} 会议。自动记事已关闭。</div>${btn('确认保存候选','manualMemory','',`data-due="${due}" data-source="${esc(t)}"`)}`;return}saveMemory(due,t,m);r.innerHTML='<div class="preview">已记下会议安排。到点将结合新观察选择提醒方式。</div>'+btn('查看安排','toMemory','ghost')}
function saveMemory(due,source,m){s.events.filter(e=>e.type==='wake'&&!['resolved','cancelled'].includes(e.status)).forEach(e=>{e.status='cancelled';e.receipts.push('安排已更新，旧提醒失效')});if(m){m.due=due;m.source=source;m.status='active'}else s.memories.push({id:'m'+s.seq++,title:'会议',due,source,status:'active'});persist()}
function wake(){let m=s.memories.find(m=>m.status==='active');if(!m){toast('先记下一条有效会议安排，再体验提醒');navigate('memory');return}const remindAt=new Date(new Date(m.due+':00+08:00').getTime()-10*60000+8*3600000).toISOString().slice(0,16);if(blocked()){let e={id:'e'+s.seq++,due:m.due,remindAt,type:'wake',status:'pending',receipts:['已到提醒时间 · 当前现场状态未知 · 建议应用内文字提醒']};s.events.unshift(e);s.clock=remindAt.slice(5,10).replace('-','/')+' '+remindAt.slice(11);render();show('会议提醒 · 现场状态待确认',`<div class="notice">感知暂停或设备离线。保留已接受的日程提醒，当前采用应用内文字提示。</div><p>你安排的会议即将开始：${esc(m.due.replace('T',' '))}。</p>${btn('我已知晓','ack','',`data-id="${e.id}"`)}`);return}let e=s.events.find(e=>e.type==='wake'&&e.status==='pending');if(!e){e={id:'e'+s.seq++,due:m.due,remindAt,type:'wake',status:'pending',receipts:['到期任务已读取新观察 · 模拟时间']};s.events.unshift(e)}s.clock=remindAt.slice(5,10).replace('-','/')+' '+remindAt.slice(11);navigate('home');detail(e.id)}
function pluginDialog(id){let t=templates.find(x=>x.id===id);if(!t)return;show(t.name,`<span class="pill gold">本地模板 · ${t.version}</span><p style="margin-top:15px">${t.desc}</p><h3>请求权限</h3><p>${t.permission}。</p><h3>数据与版本</h3><p class="muted">${t.retention}。作者：${t.author}。</p><div class="preview" id="template-test" style="margin:18px 0">先使用脱敏样例测试，确认行动提议后启用。</div><div class="row">${btn('运行测试事件','testTemplate','secondary',`data-template="${id}"`)}${s.installed.includes(id)?btn('停用模板','uninstall','secondary',`data-template="${id}"`):btn('确认权限并启用','install','',`data-template="${id}" disabled id="install-template"`)}</div>`)}
function validateRule(raw){let r=JSON.parse(raw);let keys=['id','version','event','mode','action','message','max_per_day'];if(!r||Array.isArray(r)||keys.some(k=>!(k in r))||Object.keys(r).some(k=>!keys.includes(k)))throw Error('请使用固定的七个规则字段');if(!/^[a-z0-9_-]{1,40}$/.test(r.id)||typeof r.version!=='string'||r.version.length>20)throw Error('规则标识或版本格式有误');if(!['pet','delivery','rain'].includes(r.event)||!['companion','efficient','any'].includes(r.mode)||!['suggest_voice','suggest_notification'].includes(r.action))throw Error('触发条件或动作超出当前白名单');if(typeof r.message!=='string'||r.message.length>100||!Number.isInteger(r.max_per_day)||r.max_per_day<1||r.max_per_day>3)throw Error('消息限 100 字，每日上限为 1–3 次');if(/不在家|无人|没人|独居|姓名|密码|会议/.test(r.message))throw Error('请将对外话术调整为简短的待客或事件提示');return r}
const storySteps=[['门口的礼貌回应','访客放下物品，查看依据并确认感谢语。'],['团子的饮水动态','观察到饮水行为，试试高效与陪伴的不同策略。'],['记住一句口头安排','“明天9点开会”，自动形成可修改的安排。'],['早晨 08:50','获取新观察，结合可能仍在休息的状态准备提醒。'],['收到明确回应','用户表示已知晓，停止后续提醒并记录结果。'],['下雨时的窗边关怀','窗框变化与降雨信号共同形成查看建议。'],['按生活习惯定制','查看历史样例与偏好，测试一条关怀规则。'],['一天的事情，有了交代','查看已处理的事件与已回应的安排。']];
function storybar(){let [title,desc]=storySteps[s.story];return `<section class="storybar"><div class="row between"><div><span class="eyebrow muted">正常运行流程 · ${s.story+1} / 8</span><strong style="display:block;margin-top:3px">${title}</strong><p>${desc}</p></div><div class="row">${btn(s.story===7?'完成体验':'下一步 →',s.story===7?'endStory':'nextStory','tiny')}${btn('退出流程','endStory','ghost tiny')}</div></div><div class="steps">${storySteps.map((_,i)=>`<i class="${i<=s.story?'done':''}"></i>`).join('')}</div></section>`}
function storyAt(i){close();s.story=i;s.perception=true;s.offline=false;if(i===0){navigate('home');addScene('delivery')}if(i===1){let d=s.events.find(e=>e.type==='delivery');if(d){d.status='resolved';d.receipts.push('流程脚本：用户确认感谢，模拟播报完成')}addScene('pet')}if(i===2){page='memory';s.clock='09/27 21:10';render();capture()}if(i===3){if(!s.memories.some(m=>m.status==='active'))saveMemory('2026-09-28T09:00','好，我记住了，明天9点开会。');wake()}if(i===4){s.events.filter(e=>e.type==='wake').forEach(e=>{e.status='resolved';e.receipts.push('流程脚本：确认提醒 → 用户明确回应 → 提醒结束')});s.memories.forEach(m=>{if(m.status==='active')m.status='done'});s.clock='09/28 08:51';navigate('memory')}if(i===5){addScene('rain');s.clock='09/28 18:42'}if(i===6){s.events.filter(e=>e.type==='rain').forEach(e=>{e.status='resolved';e.receipts.push('流程脚本：用户查看并确认已关窗')});navigate('extensions')}if(i===7)navigate('home');render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return}let a=b.dataset.act,id=b.dataset.id||current,e=getEvent(id);switch(a){
case 'close':close();break;case 'efficient':case 'companion':s.mode=a;render();toast(a==='efficient'?'已切换高效模式，日常关怀静默记录':'已切换陪伴模式，按频控分享关怀');break;
case 'pause':s.perception=!s.perception;if(!s.perception)s.audio=false;render();toast(s.perception?'感知已恢复（模拟）':'感知已暂停，已接受的日程继续保留');break;
case 'offline':s.offline=!s.offline;render();toast(s.offline?'连接中断，现场状态待确认':'模拟连接恢复，可以继续新观察');break;
case 'scene':addScene(b.dataset.type);break;case 'detail':detail(id);break;case 'timeline':$('timeline')?.scrollIntoView({behavior:'smooth'});break;
case 'ack':acknowledge(id);break;case 'resolve':updateEvent(id,'resolved','用户标记处理完成 · 本轮结束');toast('处理完成');break;
case 'correct':updateEvent(id,'corrected','用户更正为普通活动 · 关联提醒停止');toast('更正已记录');break;
case 'snooze':e.followups=(e.followups||0)+1;updateEvent(id,'snoozed','用户选择 5 分钟后再提醒');break;case 'resume':{let base=e.remindAt||'2026-09-27T'+eventData(e).time;let dt=new Date(base+':00+08:00');dt=new Date(dt.getTime()+5*60000+8*3600000);let next=dt.toISOString().slice(0,16);s.clock=next.slice(5,10).replace('-','/')+' '+next.slice(11);if(e.due&&next>=e.due)updateEvent(id,'cancelled','会议已开始 · 提醒循环结束');else updateEvent(id,'pending','模拟推进 5 分钟 · 最后一次跟进提醒');break}
case 'lessCare':s.rules.budget=0;render();close();toast('每日可选关怀已设为 0，事件继续记录');break;
case 'voice':show('确认门口回复',`<span class="pill gold">门口扬声器 · 通道模拟</span><h3>将播放以下话术</h3><p>“${esc(s.rules.thanks)}”</p><p class="small muted" style="margin-top:13px">模拟证据显示访客仍在门前，本次到访尚未播放感谢。</p><div class="row" style="margin-top:20px">${btn('确认模拟播放','playVoice','',`data-id="${id}"`)}${btn('返回事件','detail','secondary',`data-id="${id}"`)}</div>`);break;
case 'playVoice':updateEvent(id,'resolved','用户确认话术 · 模拟扬声器播放完成 · 本次到访已结束');toast('模拟感谢已播放');break;
case 'wakeVoice':e.voiceCount=1;updateEvent(id,'pending','温和提醒已模拟播放 · 等待明确回应');toast('“会议快开始了，准备起床了吗？”');break;
case 'wakeState':show('根据新观察选择提醒方式',`<p>选择一个当前现场样例，查看管家如何调整。</p><div class="stack" style="margin-top:20px">${btn('可能仍在休息：轻声提醒','stateRest','secondary',`data-id="${id}"`)}${btn('已经开始活动：普通会议提醒','stateActive','secondary',`data-id="${id}"`)}${btn('覆盖区域无人：应用内文字提醒','stateUnknown','secondary',`data-id="${id}"`)}</div>`);break;
case 'stateRest':case 'stateActive':case 'stateUnknown':updateEvent(id,'pending',{'stateRest':'新观察：可能仍在休息 → 提议温和提醒','stateActive':'新观察：已开始活动 → 普通会议提醒','stateUnknown':'新观察：覆盖区域未见人 → 应用内文字提醒'}[a]);break;
case 'call':confirmCall(id);break;case 'callContact':confirmCall(id,true);break;
case 'dispatch':e.remaining=s.rules.timeout;updateEvent(id,'calling',`已确认模拟发送至 ${s.contacts.owner} · 等待明确回应`);break;
case 'connected':updateEvent(id,'connected','模拟电话已接通 · 用户确认仍待接收');break;
case 'advance':e.remaining=0;s.clock='09/27 20:17';updateEvent(id,'escalate',`模拟推进 ${s.rules.timeout} 秒 · 尚未收到明确回应 · 准备联系 ${s.contacts.emergency}`);break;
case 'dispatchContact':e.remaining=s.rules.timeout;updateEvent(id,'contact',`用户确认升级 · 已模拟发送至 ${s.contacts.emergency}`);break;
case 'fail':updateEvent(id,'failed','模拟通道失败 · 尚未联系到人 · 建议人工处理');break;
case 'toMemory':close();navigate('memory');break;case 'toRules':close();navigate('rules');break;case 'toSettings':close();navigate('settings');break;
case 'capture':capture();break;case 'sample':$('utterance').value=b.dataset.sample;break;case 'parse':parse();break;
case 'manualMemory':saveMemory(b.dataset.due,b.dataset.source,s.memories.find(m=>m.status==='active'));close();navigate('memory');toast('已确认保存候选安排');break;
case 'editMemory':{let m=s.memories.find(m=>m.id===id);show('修改会议时间',`<label class="field"><span>日期与时间 · Asia/Shanghai</span><input type="datetime-local" id="memory-due" value="${m.due}"></label><p class="small muted">保存后取消旧提醒，并按新时间提前 10 分钟安排。</p>${btn('保存新时间','saveMemory','',`data-id="${id}"`)}`);break}
case 'saveMemory':{let m=s.memories.find(m=>m.id===id),due=$('memory-due').value;if(!due){toast('请填写完整日期时间');break}saveMemory(due,'用户手动更正时间',m);close();render();toast('时间已更新，旧提醒已失效');break}
case 'cancelMemory':{let m=s.memories.find(m=>m.id===id);m.status='cancelled';s.events.filter(e=>e.type==='wake').forEach(e=>e.status='cancelled');render();toast('已撤销安排及关联提醒');break}
case 'deleteMemory':show('删除这条演示记忆',`<p>这将清除原句与时间，并停止对应会议提醒。</p><div class="row" style="margin-top:18px">${btn('确认删除演示记忆','confirmDeleteMemory','danger',`data-id="${id}"`)}${btn('保留','close','secondary')}</div>`);break;
case 'confirmDeleteMemory':s.memories=s.memories.filter(m=>m.id!==id);s.events=s.events.filter(e=>e.type!=='wake');close();render();toast('记忆与关联提醒已清除');break;
case 'habit':show('规律的来源',`<span class="pill gold">历史样例 · 14 天窗口</span><h3>8 个有效观察日</h3><p>样例时段覆盖率为 84%–96%。常见活动区间采用有效日的活动开始时间范围；其余 6 日包含观察缺口。</p><p class="small muted" style="margin-top:15px">区域：客厅。归属：本人在设置中声明的单人家庭。此数据用于展示可追溯习惯。</p><div class="row" style="margin-top:18px">${btn('更正并暂停此类学习','stopLearning','secondary')}${btn('关闭','close','ghost')}</div>`);break;
case 'stopLearning':s.learning=false;close();render();toast('作息学习已暂停，派生样例摘要已清除');break;
case 'audio':if(blocked()){toast('恢复感知后可开启模拟收听');break}s.audio=!s.audio;render();break;
case 'toggle':if(b.dataset.key==='audio'&&blocked()){toast('恢复感知后可开启模拟收听');break}s[b.dataset.key]=!s[b.dataset.key];render();break;
case 'saveContacts':s.contacts={owner:$('owner-name').value.trim()||'本人',emergency:$('emergency-name').value.trim()||'家人'};persist();toast('演示联系人名称已保存');break;
case 'coverage':show('观察范围与盲区',`<img src="${room}" alt="客厅覆盖区域示意" style="width:100%;border-radius:10px"><h3>E30 · 客厅样例机位</h3><p>沙发、窗边、水碗与食盆进入样例覆盖范围。卧室与走廊属于盲区。</p><h3>E340 · 门口样例机位</h3><p>入口、地垫与门外等候区。跨区域事件保持独立。叫醒场景会明确调整 E30 演示机位。</p><p class="source-note" style="margin-top:14px">插画沿用项目已有演示素材。真实设备的覆盖范围、截图和区域标定待实测。</p>`);break;
case 'plugin':pluginDialog(b.dataset.template);break;
case 'testTemplate':{let t=templates.find(t=>t.id===b.dataset.template);$('template-test').innerHTML=`测试通过：${t.name}匹配其脱敏事件。<br>行动提议：${t.action==='suggest_voice'?'准备感谢语，等待用户确认':'生成一条应用内关怀建议'}。<br>权限范围：${t.permission}。`;let install=$('install-template');if(install)install.disabled=false;break}
case 'install':if(!s.installed.includes(b.dataset.template))s.installed.push(b.dataset.template);close();render();toast('模板已在当前原型中启用');break;
case 'uninstall':s.installed=s.installed.filter(x=>x!==b.dataset.template);close();render();toast('模板已停用');break;
case 'generateRule':{let t=templates.find(t=>t.id===$('rule-idea').value);$('rule-code').value=JSON.stringify(defaultRule(t),null,2);$('test-event').value=t.event;s.pluginTested=false;toast('已根据所选场景生成规则草稿');break}
case 'testRule':try{let r=validateRule($('rule-code').value);draftRule=r;let matched=r.event===$('test-event').value&&(r.mode==='any'||r.mode===s.mode);$('plugin-result').innerHTML=`<strong>${matched?'条件匹配':'本次条件未匹配'}</strong><p>测试事件：${scenes[$('test-event').value].title}<br>模式：${s.mode==='companion'?'陪伴':'高效'}<br>${matched?'行动提议：'+esc(r.message):'当前事件或模式与规则条件有差异，保持静默。'}<br>每日上限：${r.max_per_day} 次<br>${r.action==='suggest_voice'?'语音动作进入人工确认。':'应用内建议遵循全局频控。'}</p>`;s.pluginTested=$('rule-code').value;persist()}catch(err){$('plugin-result').textContent='规则校验失败：'+err.message;s.pluginTested=false}break;
case 'saveRule':try{let r=validateRule($('rule-code').value);if(s.pluginTested!==$('rule-code').value){toast('请先测试当前版本');break}draftRule=r;s.customRule=r;persist();toast('当前版本已保存，可导出分享')}catch(err){toast(err.message)}break;
case 'exportRule':try{let r=validateRule($('rule-code').value);if(/1[3-9]\d{9}|@|https?:\/\//.test(r.message)){toast('分享检查发现联系方式或网址，请先移除');break}draftRule=r;show('分享规则',`<span class="pill">分享检查通过</span><p style="margin-top:12px">仅包含规则与版本。可下载 JSON，或选择下方内容复制分享。</p><label class="field"><span>可分享的规则 JSON</span><textarea id="export-code" rows="11" readonly>${esc(JSON.stringify(r,null,2))}</textarea></label><div class="row">${btn('下载 JSON','downloadRule')}${btn('全选内容','selectExport','secondary')}${btn('关闭','close','ghost')}</div>`);}catch(err){toast(err.message)}break;
case 'selectExport':$('export-code').focus();$('export-code').select();break;case 'downloadRule':{let content=$('export-code').value;const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='InHome-rule-'+draftRule.id+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已提交浏览器下载请求，也可复制规则内容');break}case 'importRule':try{let r=validateRule($('import-code').value);draftRule=r;$('rule-code').value=JSON.stringify(r,null,2);s.pluginTested=false;$('plugin-result').textContent='导入草稿已通过结构校验。权限：读取 '+r.event+' 类别脱敏事件，提议 '+r.action+'。请测试后保存。';toast('规则已导入编辑器，等待测试')}catch(err){toast('导入失败：'+err.message)}break;
case 'startStory':show('开始完整流程',`<p>将恢复初始演示事件与安排，保留当前规则和偏好，按 8 个节点体验日常照护。</p><div class="row" style="margin-top:18px">${btn('开始新的流程','beginStory')}${btn('继续自由探索','close','secondary')}</div>`);break;case 'beginStory':s.events=initial().events;s.memories=[];s.clock='09/27 18:30';storyAt(0);break;case 'nextStory':storyAt(Math.min(7,s.story+1));break;case 'endStory':s.story=-1;render();toast('已退出引导，可继续自由探索');break;
case 'reset':show('重置演示状态',`<p>将清除当前浏览器内的演示事件、安排、规则、偏好与显示名称，恢复初始样例。</p><div class="row" style="margin-top:18px">${btn('确认重置演示','confirmReset','danger')}${btn('取消','close','secondary')}</div>`);break;
case 'confirmReset':s=initial();draftRule=null;close();navigate('home');toast('演示已恢复初始状态');break;
} });
document.addEventListener('input',ev=>{if(['care','threshold','timeout','budget'].includes(ev.target.id)){let r={...s.rules,care:+$('care').value,threshold:+$('threshold').value,timeout:+$('timeout').value,budget:+$('budget').value};$('care-value').textContent=r.care;$('threshold-value').textContent=r.threshold;$('rule-preview').innerHTML=rulePreview(r)}});
document.addEventListener('change',ev=>{if(ev.target.id==='home-state'){s.homeState=ev.target.value;persist();toast('家庭状态已按本人设置更新')}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='rules-form')return;ev.preventDefault();let thanks=$('thanks').value.trim();if(/不在家|无人|没人|独居|姓名|会议|密码/.test(thanks)){toast('感谢语包含家庭隐私线索，请调整为简短待客内容');return}s.rules={care:+$('care').value,threshold:+$('threshold').value,timeout:+$('timeout').value,quiet:$('quiet').value,budget:+$('budget').value,tone:$('tone').value,thanks};render();toast('规则已保存，下次事件按新规则处理')});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(['home','memory','rules','extensions','settings'].includes(p)&&page!==p){page=p;render()}});
if(s.customRule)draftRule=s.customRule;
render();
</script></body></html>

function rules(){return heading('你的管家，按你的习惯','每一次主动关怀，都遵循明确的边界。')+`<form id="rules-form" class="two-col"><section class="card"><h2>关怀与提醒</h2><label class="field"><span>宠物关注度 <output id="care-value">${s.rules.care}</output> / 10</span><input type="range" id="care" min="0" max="10" value="${s.rules.care}"></label><label class="field"><span>紧急联络建议阈值 <output id="threshold-value">${s.rules.threshold}</output> / 10</span><input type="range" id="threshold" min="6" max="10" value="${s.rules.threshold}"></label><div class="form-row"><label class="field"><span>未回应升级间隔</span><select id="timeout"><option value="60" ${s.rules.timeout===60?'selected':''}>60 秒</option><option value="30" ${s.rules.timeout===30?'selected':''}>30 秒</option></select></label><label class="field"><span>安静时段开始（至 07:00）</span><input type="time" id="quiet" value="${s.rules.quiet}" required></label></div><div class="form-row"><label class="field"><span>每日可选关怀次数</span><input id="budget" type="number" min="0" max="10" value="${s.rules.budget}" required></label><label class="field"><span>关怀语气</span><select id="tone">${['简洁','温暖','轻松'].map(v=>`<option ${v===s.rules.tone?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field"><span>门口感谢语</span><textarea id="thanks" rows="3" maxlength="100" required>${esc(s.rules.thanks)}</textarea></label><p class="source-note">对外话术仅表达待客信息。包含家庭成员姓名、作息或屋内占用信息时，请先修改。</p><button class="btn" type="submit" style="margin-top:18px">保存规则</button></section><aside class="stack"><article class="card"><h2>典型事件预览</h2><div class="preview" id="rule-preview" style="margin-top:20px">${rulePreview(s.rules)}</div><p class="source-note" style="margin-top:15px">预览反映待保存规则。真实电话与设备控制均须单次确认。</p></article><article class="card"><h3>待客规则</h3><p class="small muted" style="margin-top:13px">当门口出现放下物品行为，且访客仍在可见区间，以你设置的语气建议播放感谢。</p><div class="receipt">1. 检查事件证据与新鲜度<br>2. 检查通道与权限<br>3. 展示完整话术，请你确认<br>4. 保留执行回执，结束本次待客</div></article><article class="card"><h3>持续保留的提醒</h3><p class="smal function show(title,body){focusReturn=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;if(!$('dialog').open)$('dialog').showModal()}

function detail(id){current=id;let e=getEvent(id);if(!e)return;let d=eventData(e);show(d.title,`<div class="row between"><span class="pill ${d.kind==='urgent'?'red':'gold'}">家庭事件 · ${statusText(e)}</span><span class="small muted">${d.time} / ${d.zone}</span></div><div class="evidence">${d.facts.map(x=>`<div><time>画面记录</time>${x}</div>`).join('')}</div><h3>观察到的事实</h3><p>${d.facts.map(x=>esc(x)).join('；')}。</p><h3>仍需确认</h3><p class="muted">${d.unknown}</p><h3>JEV 事件评价 <small class="muted"></small></h3>${score('紧急程度',d.u,10,true)}${score('个人关注度',e.type==='pet'?s.rules.care:d.c,10)}${score('模型估计',d.confidence,1)}<p class="source-note">评分用于解释这条事件的判断依据。</p><h3>管家的建议</h3><p>${e.type==='pet'&&s.mode==='efficient'?'当前高效模式：静默记录饮水行为。':d.suggest}</p>${e.status==='snoozed'?'<div class="notice" style="margin-top:15px">已安排 5 分钟后提醒。使用下方按钮推进时钟。</div>':''}${e.status==='calling'||e.status==='connected'||e.status==='contact'?`<div class="notice" style="margin-top:15px">${e.status==='contact'?'等待家人回应':'等待本人明确回应'} · ${e.remaining??s.rules.timeout} 秒<br>接通状态与确认处理分别记录。</div>`:''}<div class="receipt">${e.receipts.length?e.receipts.map(x=>esc(x)).join('<br>'):'行动记录：已形成建议，等待下一步。'}</div><div class="row">${eventActions(e)}</div><details style="margin-top:22px"><summary class="small muted">数据来源与保留期限</summary><p class="source-note">关键画面保留 24 小时，事件语义保留 30 天。可在设置中管理数据。</p></details>`)}
function score(label,v,max,urgent=false){return `<div class="score-row ${urgent?'urgent':''}"><span>${label}</span><div class="score-bar"><i style="width:${v/max*100}%"></i></div><span>${v} / ${max}</span></div>`}
function eventActions(e){let a='',d=eventData(e),id=`data-id="${e.id}"`;if(['resolved','corrected','cancelled'].includes(e.status))return btn('关闭','close');if(d.kind==='urgent'){
if(e.status==='pending'&&d.u<s.rules.threshold)a+=btn('现场核实并知晓','ack','',id);if(e.status==='pending'&&d.u>=s.rules.threshold)a+=btn('确认联系本人','call','',id);
if(['calling','connected'].includes(e.status))a+=btn(`推进 ${e.remaining??s.rules.timeout} 秒`,'advance','secondary',id)+(e.status==='calling'?btn('接通','connected','secondary',id):'')+btn('通道失败','fail','ghost',id);
if(e.status==='escalate')a+=btn('确认联系紧急联系人','callContact','',id);
if(e.status==='contact')a+=btn('家人确认接手','ack','',id)+btn('联系失败','fail','secondary',id);
if(e.status==='failed')a+=btn('转人工并确认知晓','ack','',id);
}
if(e.status==='pending'&&d.kind==='voice')a+=btn('确认感谢语','voice','',id);
if(e.status==='pending'&&d.kind==='wake'&&!e.voiceCount)a+=btn('确认温和提醒','wakeVoice','',id)+btn('选择当前现场状态','wakeState','secondary',id);
if(e.status==='snoozed')a+=btn('推进 5 分钟','resume','',id);
if(e.status==='ack')a+=btn('标记处理完成','resolve','',id);else a+=btn('我已知晓','ack','secondary',id);
if(['pending','recorded'].includes(e.status)){if(!e.followups)a+=btn('稍后提醒','snooze','secondary',id);a+=btn('更正为普通活动','correct','ghost',id);}
if(d.kind==='care')a+=btn('少提醒此类','lessCare','ghost',id);
return a}
function addScene(type){if(type==='wake'){wake();return}if(blocked()){toast('请恢复感知与设备连接，再生成新观察');return}let existing=s.events.find(e=>e.type===type&&!['resolved','corrected','cancelled'].includes(e.status));if(existing){navigate('home');detail(existing.id);return}let d=scenes[type],quiet=d.time>=s.rules.quiet||d.time<'07:00',budgetUsed=s.events.filter(e=>e.shared).length;let share=d.kind==='care'&&s.mode==='companion'&&!quiet&&budgetUsed<s.rules.budget;let e={id:'e'+s.seq++,type,status:['record','care'].includes(d.kind)?'recorded':'pending',receipts:[],shared:share};if(d.kind==='care')e.receipts.push(share?'已生成应用内关怀卡 · 已连接':'已静默记录 · 当前模式或频控策略');templates.filter(t=>s.installed.includes(t.id)&&t.event===type).forEach(t=>e.receipts.push('已启用模板 '+t.name+'：'+(t.action==='suggest_voice'?'建议感谢语，执行前确认':'生成关怀提议，遵循当前模式与频控')));s.events.unshift(e);s.clock='09/27 '+d.time;navigate('home');toast(share?'一条新的生活关怀，已放进时间线':'家庭事件已加入今天的记录')}
function updateEvent(id,status,text){let e=getEvent(id);if(!e)return;e.status=status;if(text)e.receipts.push(text);render();if($('dialog').open)detail(id)}
function acknowledge(id){let e=getEvent(id);if(!e)return;e.remaining=null;updateEvent(id,'ack','已收到明确回应 · 停止后续升级 · 等待处理完成');if(e.type==='wake')s.memories.forEach(m=>{if(m.status==='active'){m.status='done'}});persist();toast('已停止后续提醒，处理完成后可单独标记')}
function confirmCall(id,contact=false){let e=getEvent(id);if(!e)return;show(contact?'确认联系紧急联系人':'确认联系本人',`<span class="pill gold">已连接</span><h3>接收人：${esc(contact?s.contacts.emergency:s.contacts.owner)}</h3><p>将发送：“客厅出现疑似跌倒事件，需要核实。请确认是否已知晓。”</p><p class="small muted" style="margin-top:12px">分享范围：事件摘要与发生时间。图像证据保持本地。接收人来自你的家庭联系人。</p><div class="row" style="margin-top:23px">${btn('确认发送',contact?'dispatchContact':'dispatch','',`data-id="${id}"`)}${btn('返回事件','detail','secondary',`data-id="${id}"`)}</div>`)}
function capture(){show('记下一件事',`<span class="pill gold">口述安排 · 今天 21:10</span><p style="margin-top:15px">体验“随口说出安排，管家主动记住”。</p><label class="field"><span>口述内容</span><textarea id="utterance" rows="3">好，我记住了，明天9点开会。</textarea></label><div class="row">${btn('明确安排','sample','secondary tiny','data-sample="好，我记住了，明天9点开会。"')}${btn('引用他人','sample','secondary tiny','data-sample="他说他明天9点开会。"')}${btn('取消安排','sample','secondary tiny','data-sample="明天9点的会议取消了。"')}${btn('改期安排','sample','secondary tiny','data-sample="明天会议改到10点。"')}</div><p class="source-note" style="margin:14px 0">家庭时区 Asia/Shanghai。时间与归属有疑问时，会先请你确认。</p>${btn('理解并记下','parse')}<div id="capture-result" style="margin-top:16px" aria-live="polite"></div>`)}
function parse(){let t=$('utterance').value.trim(),r=$('capture-result');if(!t){r.textContent='请输入口述内容。';return}if(/他说|她说|如果|可能|不确定|或许/.test(t)){r.innerHTML='<div class="preview">这句话的归属或条件仍需确认。当前保留为待核实说明。</div>';return}if(/取消|不开|别提醒|不要提醒/.test(t)){s.memories.forEach(m=>{if(m.status==='active')m.status='cancelled'});s.events.filter(e=>e.type==='wake').forEach(e=>{e.status='cancelled';e.receipts.push('安排已撤销，关联提醒已停止')});persist();r.innerHTML='<div class="preview">已撤销体验会议安排，同时停止关联提醒。</div>';return}let match=t.match(/明天.*?(\d{1,2})\s*[点:时]/);if(!match||+match[1]>23||!/会/.test(t)){r.innerHTML='<div class="preview">时间或事项需要进一步核实。请用“明天9点开会”一类明确的表达。</div>';return}if(/不|没/.test(t)&&!/记住/.test(t)){r.innerHTML='<div class="preview">语义可能包含否定，保留为待核实说明。</div>';return}let due='2026-09-28T'+match[1].padStart(2,'0')+':00',m=s.memories.find(m=>m.status==='active');if(!s.autoMemory){r.innerHTML=`<div class="preview">已形成候选：${due.replace('T',' ')} 会议。自动记事已关闭。</div>${btn('确认保存候选','manualMemory','',`data-due="${due}" data-source="${esc(t)}"`)}`;return}saveMemory(due,t,m);r.innerHTML='<div class="preview">已记下会议安排。到点将结合新观察选择提醒方式。</div>'+btn('查看安排','toMemory','ghost')}
function saveMemory(due,source,m){s.events.filter(e=>e.type==='wake'&&!['resolved','cancelled'].includes(e.status)).forEach(e=>{e.status='cancelled';e.receipts.push('安排已更新，旧提醒失效')});if(m){m.due=due;m.source=source;m.status='active'}else s.memories.push({id:'m'+s.seq++,title:'会议',due,source,status:'active'});persist()}
function wake(){let m=s.memories.find(m=>m.status==='active');if(!m){toast('先记下一条有效会议安排，再体验提醒');navigate('memory');return}const remindAt=new Date(new Date(m.due+':00+08:00').getTime()-10*60000+8*3600000).toISOString().slice(0,16);if(blocked()){let e={id:'e'+s.seq++,due:m.due,remindAt,type:'wake',status:'pending',receipts:['已到提醒时间 · 当前现场状态未知 · 建议应用内文字提醒']};s.events.unshift(e);s.clock=remindAt.slice(5,10).replace('-','/')+' '+remindAt.slice(11);render();show('会议提醒 · 现场状态待确认',`<div class="notice">感知暂停或设备离线。保留已接受的日程提醒，当前采用应用内文字提示。</div><p>你安排的会议即将开始：${esc(m.due.replace('T',' '))}。</p>${btn('我已知晓','ack','',`data-id="${e.id}"`)}`);return}let e=s.events.find(e=>e.type==='wake'&&e.status==='pending');if(!e){e={id:'e'+s.seq++,due:m.due,remindAt,type:'wake',status:'pending',receipts:['到期任务已读取新观察']};s.events.unshift(e)}s.clock=remindAt.slice(5,10).replace('-','/')+' '+remindAt.slice(11);navigate('home');detail(e.id)}
function pluginDialog(id){let t=templates.find(x=>x.id===id);if(!t)return;show(t.name,`<span class="pill gold">本地模板 · ${t.version}</span><p style="margin-top:15px">${t.desc}</p><h3>请求权限</h3><p>${t.permission}。</p><h3>版本与说明</h3><p class="muted">${t.retention}。作者：${t.author}。</p><div class="preview" id="template-test" style="margin:18px 0">先使用脱敏测试，确认行动提议后启用。</div><div class="row">${btn('预览效果','testTemplate','secondary',`data-template="${id}"`)}${s.installed.includes(id)?btn('停用模板','uninstall','secondary',`data-template="${id}"`):btn('确认权限并启用','install','',`data-template="${id}" disabled id="install-template"`)}</div>`)}
function validateRule(raw){let r=JSON.parse(raw);let keys=['id','version','event','mode','action','message','max_per_day'];if(!r||Array.isArray(r)||keys.some(k=>!(k in r))||Object.keys(r).some(k=>!keys.includes(k)))throw Error('请使用固定的七个规则字段');if(!/^[a-z0-9_-]{1,40}$/.test(r.id)||typeof r.version!=='string'||r.version.length>20)throw Error('规则标识或版本格式有误');if(!['pet','delivery','rain'].includes(r.event)||!['companion','efficient','any'].includes(r.mode)||!['suggest_voice','suggest_notification'].includes(r.action))throw Error('触发条件或动作超出当前白名单');if(typeof r.message!=='string'||r.message.length>100||!Number.isInteger(r.max_per_day)||r.max_per_day<1||r.max_per_day>3)throw Error('消息限 100 字，每日上限为 1–3 次');if(/不在家|无人|没人|独居|姓名|密码|会议/.test(r.message))throw Error('请将对外话术调整为简短的待客或事件提示');return r}
const storySteps=[['门口的礼貌回应','访客放下物品，查看依据并确认感谢语。'],['团子的饮水动态','观察到饮水行为，试试高效与陪伴的不同策略。'],['记住一句口头安排','“明天9点开会”，自动形成可修改的安排。'],['早晨 08:50','获取新观察，结合可能仍在休息的状态准备提醒。'],['收到明确回应','用户表示已知晓，停止后续提醒并记录结果。'],['下雨时的窗边关怀','窗框变化与降雨信号共同形成查看建议。'],['按生活习惯定制','查看习惯摘要与偏好，测试一条关怀规则。'],['一天的事情，有了交代','查看已处理的事件与已回应的安排。']];
function storybar(){let [title,desc]=storySteps[s.story];return `<section class="storybar"><div class="row between"><div><span class="eyebrow muted">正常运行流程 · ${s.story+1} / 8</span><strong style="display:block;margin-top:3px">${title}</strong><p>${desc}</p></div><div class="row">${btn(s.story===7?'完成体验':'下一步 →',s.story===7?'endStory':'nextStory','tiny')}${btn('退出流程','endStory','ghost tiny')}</div></div><div class="steps">${storySteps.map((_,i)=>`<i class="${i<=s.story?'done':''}"></i>`).join('')}</div></section>`}
function storyAt(i){close();s.story=i;s.perception=true;s.offline=false;if(i===0){navigate('home');addScene('delivery')}if(i===1){let d=s.events.find(e=>e.type==='delivery');if(d){d.status='resolved';d.receipts.push('流程脚本：用户确认感谢，播报完成')}addScene('pet')}if(i===2){page='memory';s.clock='09/27 21:10';render();capture()}if(i===3){if(!s.memories.some(m=>m.status==='active'))saveMemory('2026-09-28T09:00','好，我记住了，明天9点开会。');wake()}if(i===4){s.events.filter(e=>e.type==='wake').forEach(e=>{e.status='resolved';e.receipts.push('流程脚本：确认提醒 → 用户明确回应 → 提醒结束')});s.memories.forEach(m=>{if(m.status==='active')m.status='done'});s.clock='09/28 08:51';navigate('memory')}if(i===5){addScene('rain');s.clock='09/28 18:42'}if(i===6){s.events.filter(e=>e.type==='rain').forEach(e=>{e.status='resolved';e.receipts.push('流程脚本：用户查看并确认已关窗')});navigate('extensions')}if(i===7)navigate('home');render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return}let a=b.dataset.act,id=b.dataset.id||current,e=getEvent(id);switch(a){

const cameraArt = (() => {
  let serial = 0;
  return function cameraArt(camera = 'living', type = 'idle', phase = 1) {
    const p = Math.max(0, Math.min(2, Number(phase) || 0));
    const k = 'camArt' + (++serial) + '-';

  rain:[['rain-background','窗边的事处理好了，雨声可以安心当背景音乐。'],['rain-slow','窗边的事有了交代，接下来适合慢一点。']],

  wake:[['wake-reply','提醒已经收到，剩下的交给醒来的你。'],['wake-first','今天的第一件事，已经排好队了。']]
 };
 const fresh=()=>({enabled:true,frequency:'occasional',started:false,current:null,history:[],dailyCounts:{},checked:[],lastAutomaticAt:0,calmUntil:0,riskActive:false,mutedDay:null});
 const minutes=t=>{const a=t.split(':').map(Number);return a[0]*60+(a[1]||0)};
 function candidates(ctx){
  return ctx.events.filter(e=>{
   if(!lines[e.type]||['corrected','cancelled'].includes(e.status))return false;
   const age=(Date.parse(ctx.day+'T'+ctx.time+':00Z')-Date.parse(e.day+'T'+e.time+':00Z'))/60000;if(!Number.isFinite(age)||age<0||age>90)return false;
   if(e.type==='rain'&&e.status!=='resolved')return false;
   if(e.type==='wake'&&!['resolved','ack'].includes(e.status))return false;
   if(e.type==='pet_wait'&&ctx.homeState!=='离家')return false;
   if(e.type==='night_activity'&&!(minutes(ctx.time)>=1320||minutes(ctx.time)<120))return false;
   return true;
  }).sort((a,b)=>(b.day+'T'+b.time).localeCompare(a.day+'T'+a.time)).map(e=>({...e,key:e.id+':'+e.type,lines:lines[e.type]}));
 }
 function choose(source,history=[],rng=Math.random){
  const recent=new Set(history.slice(-5).map(m=>m.lineId));let pool=source.lines.filter(([id])=>!recent.has(id));
  if(!pool.length)pool=source.lines.filter(([id])=>id!==history.at(-1)?.lineId);
  if(!pool.length)pool=source.lines;
  const [lineId,text]=pool[Math.min(pool.length-1,Math.floor(rng()*pool.length))];
  return {lineId,text,kind:source.type,eventId:source.id,sourceTitle:source.title,sourceFacts:source.facts,sourceTime:source.time,sourceDay:source.day};
 }
 function consider(state,ctx,now=Date.now(),rng=Math.random){
  if(ctx.urgent){state.riskActive=true;return null}
  if(state.riskActive){state.riskActive=false;state.calmUntil=now+30*60000}
  if(!state.enabled||ctx.mode!=='companion'||!ctx.perception||ctx.offline||ctx.budget===0||state.mutedDay===ctx.day||now<state.calmUntil)return null;
  const f=frequencies[state.frequency]||frequencies.occasional;
  if((state.dailyCounts[ctx.day]||0)>=f.cap)return null;
  if(state.lastAutomaticAt&&now-state.lastAutomaticAt<f.gap*60000)return null;
  const source=candidates(ctx).find(c=>!state.checked.includes(c.key));if(!source)return null;
  state.checked.push(source.key);state.checked=state.checked.slice(-120);
  const first=!state.started;state.started=true;
  if(!first&&rng()>=f.probability)return null;
  const note={...choose(source,state.history,rng),id:source.key+':'+now,day:ctx.day,time:ctx.time,createdAt:now,automatic:true,silent:quiet(ctx.time,ctx.quietStart||'22:00'),read:false,dismissed:false};
  state.current=note;state.history.push(note);state.history=state.history.slice(-40);state.dailyCounts[ctx.day]=(state.dailyCounts[ctx.day]||0)+1;state.lastAutomaticAt=now;return note;
 }
 function quiet(time,start){const n=minutes(time);return n>=minutes(start)||n<420}
 function available(state,ctx,now=Date.now()){
  const note=state.current;
  if(!note||note.read||note.dismissed||note.automatic===false||!state.enabled||ctx.mode!=='companion'||!ctx.perception||ctx.offline||ctx.budget===0||ctx.urgent||state.riskActive||now<state.calmUntil||state.mutedDay===ctx.day)return null;
  const age=(Date.parse(ctx.day+'T'+ctx.time+':00Z')-Date.parse(note.day+'T'+note.time+':00Z'))/60000;
  const source=ctx.events.find(e=>e.id===note.eventId);
  if(!source||['corrected','cancelled'].includes(source.status)||!Number.isFinite(age)||age<0||age>1440)return null;
  return note;
 }
 function consume(state,id,kind='read'){
  const note=state.current;
  if(!note||note.id!==id)return false;
  const key=kind==='dismissed'?'dismissed':'read';note[key]=true;
  for(const item of state.history)if(item.id===id)item[key]=true;
  return true;
 }
 return {frequencies,lines,fresh,candidates,choose,consider,quiet,available,consume};
})();

function ensureChatter(){
 if(!s.chatter){s.chatter=Chatter.fresh();s.chatter.checked=s.events.filter(e=>e.id.startsWith('seed-')).map(e=>e.id+':'+e.type)}
 const def=Chatter.fresh();for(const key of Object.keys(def))if(s.chatter[key]===undefined)s.chatter[key]=def[key];
 if(s.chatter.notificationVersion!==2){
  s.chatter.frequency='occasional';s.chatter.notificationVersion=2;
  if(s.chatter.current&&!s.chatter.current.id)s.chatter.current.id=s.chatter.current.eventId+':'+s.chatter.current.createdAt;
 }
}
ensureChatter();
function chatterContext(){return {day:observationDate(),time:s.clock.slice(-5),quietStart:s.rules.quiet,mode:s.mode,perception:s.perception,offline:s.offline,homeState:s.homeState,budget:s.rules.budget,urgent:s.events.some(e=>eventData(e).u>=4&&['pending','ack','calling','connected','escalate','contact','failed'].includes(e.status)),events:s.events.map(e=>{const d=eventData(e),c=clipFor(e);return {id:e.id,type:e.type,status:e.status,title:d.title,facts:cameraFacts(e),day:c.date,time:d.time}})}}
function lifeMessageSetting(){ensureChatter();return `<div class="setting"><div><h3>生活消息</h3><p>偶尔分享家里的日常，安静时段静默送达。</p></div><button class="switch ${s.chatter.enabled?'on':''}" role="switch" aria-checked="${s.chatter.enabled}" aria-label="生活消息" data-act="lifeMessages"></button></div>`}
const notificationsBeforeLife=notificationSettings;

function lifeNotificationOptions(){show('锁屏显示选项',`<div class="notification-options">${toggle('锁屏安全状态常驻显示','持续显示观察范围与最新状态。','notifyPersistent')}${toggle('安全状态变化弹窗','变化时显示事件通知，轻点查看对应画面。','notifyChanges')}${lifeMessageSetting()}${btn('查看锁屏效果','returnLock')}</div>`)}
const renderLockBeforeLife=renderLock;
renderLock=function(){
 renderLockBeforeLife();
 const host=$('lockscreen');if(!host||!s.locked)return;
 const context=chatterContext(),note=Chatter.available(s.chatter,context);
 if(!note||safetySummary().level!=='normal'||host.querySelector('.lock-notification'))return;

 card.innerHTML=`<button class="lock-notification" data-act="openLifeMessage" data-message="${esc(note.id)}"><div class="app-line">${icon('home')}<span>在家 InHome</span><span>${esc(note.time)}</span></div><p>${esc(note.text)}</p></button><button class="lock-life-close" data-act="dismissLifeMessage" data-message="${esc(note.id)}" aria-label="关闭这条生活消息">×</button>`;
 const empty=host.querySelector('.lock-empty');if(empty)empty.replaceWith(card);else host.querySelector('.lock-bottom').before(card);
};
const renderBeforeChatter=render;

document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act;
 if(!['lifeMessages','openLifeMessage','dismissLifeMessage','notificationOptions','lockPreview'].includes(a))return;
